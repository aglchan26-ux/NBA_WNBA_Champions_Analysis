project:
  type: website
  output-dir: _site
  resources:
    - js/plotly.min.js

website:
  title: "Hoops Value"
  description: "Which player archetypes drive winning in the NBA and WNBA, and does pay track that value?"
  site-url: https://aglchan26-ux.github.io/NBA_WNBA_Public_Comparison/
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: data.qmd
        text: Data
      - href: archetypes.qmd
        text: Archetypes
      - href: championships.qmd
        text: Championships
      - href: impact.qmd
        text: Player impact
      - href: salary.qmd
        text: Salary value
      - href: methods.qmd
        text: Methods
  page-footer:
    center: "Association, not causation. Sources and licenses on the Data page."

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    toc: true
    code-fold: true
    code-summary: "Show code"
    include-in-header:
      # Quarto also loads require.js; with it present plotly.js registers as an AMD module and never sets
      # window.Plotly, so the charts fail. Hide `define` while plotly.js loads, then restore it.
      - text: '<script>window.__amd_define = window.define; window.define = undefined;</script><script src="js/plotly.min.js"></script><script>window.define = window.__amd_define;</script>'
    include-after-body: plotly-theme.html

execute:
  output: asis      # cells print raw HTML / markdown (see _viz.show)
  freeze: auto      # outputs are rendered locally (with the data) and committed; CI never needs the raw data
  echo: false
  warning: false

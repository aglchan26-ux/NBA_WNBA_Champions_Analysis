# Publishes site/ to GitHub Pages. Pages read only the small aggregated tables committed in site/data,
# so CI can execute any page whose frozen output is stale; it never needs the raw data.
name: Publish site
# The public site lives in aglchan26-ux/NBA_WNBA_Public_Comparison (this repo is private, and free
# GitHub Pages needs a public repo). This job is kept for manual runs only.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jupyter nbformat nbclient pandas==2.2.3 plotly==5.24.1 tabulate
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
          render: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
